<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>랜덤 유니코드 20개</title>
  <link rel="stylesheet" href="aa.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f5f5f5;
    }
    .navbar {
      background-color: #333;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar-title {
      font-size: 1.5rem;
    }
    .login-btn, .logout-btn {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
      margin-left: 8px;
    }
    .sidebar {
      width: 200px;
      position: fixed;
      top: 50px;
      left: 0;
      background-color: #222;
      color: white;
      height: 100%;
      padding-top: 20px;
      display: none;
      flex-direction: column;
    }
    .sidebar a {
      padding: 10px 20px;
      text-decoration: none;
      color: white;
      display: block;
    }
    .sidebar a:hover {
      background-color: #444;
    }
    .content {
      margin-left: 220px;
      padding: 20px;
    }
    .hidden {
      display: none;
    }
    .unicode {
      font-size: 2rem;
      margin: 10px;
    }
    .card {
      background-color: white;
      padding: 15px;
      margin: 10px auto;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      cursor: pointer;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
      text-align: center;
    }
    textarea, input[type="text"], input[type="email"], input[type="password"] {
      width: 90%;
      padding: 10px;
      margin: 5px auto;
      display: block;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .comment-box {
      border-top: 1px solid #ddd;
      margin-top: 10px;
      padding-top: 10px;
    }
    .comment-box li {
      margin-bottom: 6px;
      font-size: 0.9rem;
    }
    .admin-menu {
      background: #ffeeba;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      color: #856404;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-title">블라인드</div>
    <div>
      <span id="user-info" class="hidden"></span>
      <button id="login-btn" class="login-btn" onclick="toggleLoginModal()">로그인</button>
      <button id="logout-btn" class="logout-btn hidden" onclick="logoutUser()">로그아웃</button>
    </div>
  </nav>

  <div class="sidebar" id="sidebar">
    <a href="#" onclick="showSection('unicode')">싱글벙글 유니코드</a>
    <a href="#" onclick="showSection('board')">📝 게시판</a>
    <div id="admin-panel" class="hidden">
      <a href="#" onclick="showSection('admin')">🔧 관리자 메뉴</a>
    </div>
  </div>

  <div class="content">
    <section id="unicode-section">
      <h1>랜덤 유니코드 20개</h1>
      <div id="unicode-container" class="unicode"></div>
      <button onclick="generateUnicode()">다시 생성</button>
    </section>

    <section id="board-section" class="hidden">
      <h2>게시판</h2>
      <textarea id="post-content" placeholder="여기에 글을 작성하세요..."></textarea>
      <br />
      <button onclick="addPost()">글 작성</button>
      <ul id="post-list"></ul>
    </section>

    <section id="admin-section" class="hidden">
      <h2>관리자 권한 부여</h2>
      <input type="email" id="admin-email" placeholder="관리자 권한 줄 이메일 입력" />
      <button onclick="grantAdmin()">권한 부여</button>
    </section>
  </div>

  <div id="login-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="toggleLoginModal()">&times;</span>
      <h2>로그인</h2>
      <input type="email" id="login-email" placeholder="이메일" />
      <input type="password" id="login-password" placeholder="비밀번호" />
      <button onclick="loginUser()">로그인</button>
      <hr />
      <h3>회원가입</h3>
      <input type="email" id="signup-email" placeholder="이메일" />
      <input type="password" id="signup-password" placeholder="비밀번호" />
      <button onclick="registerUser()">회원가입</button>
    </div>
  </div>

  <script>
    let currentUser = null;
    let isAdmin = false;

    function toggleLoginModal() {
      const modal = document.getElementById("login-modal");
      modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function logoutUser() {
      currentUser = null;
      isAdmin = false;
      localStorage.removeItem("currentUser");  // 로그아웃 시 상태 제거
      document.getElementById("login-btn").classList.remove("hidden");
      document.getElementById("logout-btn").classList.add("hidden");
      document.getElementById("user-info").classList.add("hidden");
      document.getElementById("sidebar").style.display = "none";
      showSection("unicode");
    }

    function showSection(section) {
      document.getElementById("unicode-section").classList.add("hidden");
      document.getElementById("board-section").classList.add("hidden");
      document.getElementById("admin-section").classList.add("hidden");
      document.getElementById(section + "-section").classList.remove("hidden");
    }

    function generateUnicode() {
      const container = document.getElementById("unicode-container");
      let chars = "";
      for (let i = 0; i < 20; i++) {
        chars += getRandomUnicodeChar() + " ";
      }
      container.textContent = chars;
    }

    function getRandomUnicodeChar() {
      const min = 0x0020, max = 0x2BFF;
      let code;
      do {
        code = Math.floor(Math.random() * (max - min)) + min;
      } while ((code >= 0xD800 && code <= 0xDFFF) || code === 0xFEFF);
      return String.fromCharCode(code);
    }

    function registerUser() {
      const email = document.getElementById("signup-email").value;
      const password = document.getElementById("signup-password").value;
      if (!email || !password) return alert("입력하세요.");
      const users = JSON.parse(localStorage.getItem("users") || "{}");
      if (users[email]) return alert("이미 존재합니다.");
      users[email] = { password, role: "user" };
      localStorage.setItem("users", JSON.stringify(users));
      alert("회원가입 성공!");
    }

    function loginUser() {
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;
      const users = JSON.parse(localStorage.getItem("users") || "{}");
      if (!users[email] || users[email].password !== password)
        return alert("로그인 실패");
      currentUser = email;
      isAdmin = users[email].role === "admin";
      if (email === "JHS0112") {
        users[email].role = "admin";
        localStorage.setItem("users", JSON.stringify(users));
      }
      localStorage.setItem("currentUser", email); // 로그인 상태 저장
      document.getElementById("login-btn").classList.add("hidden");
      document.getElementById("logout-btn").classList.remove("hidden");
      document.getElementById("user-info").classList.remove("hidden");
      document.getElementById("user-info").textContent = email;
      document.getElementById("sidebar").style.display = "flex";
      document.getElementById("admin-panel").classList.toggle("hidden", !isAdmin);
      toggleLoginModal();
      showSection("board");
      renderPosts();
    }

    function addPost() {
      const content = document.getElementById("post-content").value.trim();
      if (!content) return alert("내용을 입력하세요.");
      const posts = JSON.parse(localStorage.getItem("posts") || "[]");
      posts.unshift({ content, date: new Date().toLocaleString(), comments: [] });
      localStorage.setItem("posts", JSON.stringify(posts));
      document.getElementById("post-content").value = "";
      renderPosts();
    }

    function renderPosts() {
      const posts = JSON.parse(localStorage.getItem("posts") || "[]");
      const list = document.getElementById("post-list");
      list.innerHTML = "";
      posts.forEach((post, index) => {
        const li = document.createElement("li");
        li.className = "card";
        li.onclick = () => viewPost(index);
        li.innerHTML = `<strong>${post.date}</strong><br/>${post.content}`;
        list.appendChild(li);
      });
    }

    function viewPost(index) {
      localStorage.setItem("viewPostIndex", index);
      window.location.href = `post.html?index=${index}`;
    }

    function grantAdmin() {
      const email = document.getElementById("admin-email").value;
      const users = JSON.parse(localStorage.getItem("users") || "{}");
      if (!users[email]) return alert("유저가 없습니다.");
      users[email].role = "admin";
      localStorage.setItem("users", JSON.stringify(users));
      alert(`${email} 에게 관리자 권한이 부여되었습니다.`);
    }

    window.onload = function () {
      // 로그인 상태 복원
      const savedUser = localStorage.getItem("currentUser");
      const users = JSON.parse(localStorage.getItem("users") || "{}");
      if (savedUser && users[savedUser]) {
        currentUser = savedUser;
        isAdmin = users[savedUser].role === "admin";
        document.getElementById("login-btn").classList.add("hidden");
        document.getElementById("logout-btn").classList.remove("hidden");
        document.getElementById("user-info").classList.remove("hidden");
        document.getElementById("user-info").textContent = currentUser;
        document.getElementById("sidebar").style.display = "flex";
        document.getElementById("admin-panel").classList.toggle("hidden", !isAdmin);
        showSection("board");
        renderPosts();
      } else {
        showSection("unicode");
      }
      generateUnicode();
    };
  </script>
</body>
</html>
